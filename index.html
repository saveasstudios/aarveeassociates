function printLoanCard() {

    const content = document.getElementById("loanCardContent").innerHTML;

    const win = window.open("", "_blank", "width=800,height=900");

    win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
        <title>Loan Card</title>

        <style>

        @page{
            size:A5 portrait;
            margin:8mm;
        }

        *{
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            margin:0;
            padding:0;
            background:#fff;
        }

        .page{
            width:100%;
            min-height:100%;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table,th,td{
            border:1px solid #000;
        }

        th,td{
            padding:8px;
            font-size:13px;
        }

        img{
            max-width:100%;
        }

        button{
            display:none;
        }

        </style>

    </head>

    <body>

        <div class="page">
            ${content}
        </div>

    </body>
    </html>
    `);

    win.document.close();

    setTimeout(()=>{
        win.focus();
        win.print();
    },500);

}
